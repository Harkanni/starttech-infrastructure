<svg width="820" height="520" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="330" y="16" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="410" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>

  <line x1="410" y1="60" x2="410" y2="98" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CloudFront -->
  <rect x="290" y="100" width="240" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="410" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">CloudFront</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#0C447C">routes by real path prefixes</text>

  <!-- branch lines -->
  <path d="M340 156 C 250 190, 200 200, 170 220" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480 156 C 570 190, 620 200, 650 220" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="70" y="222" width="200" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
  <text x="170" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#173404">S3 (frontend)</text>
  <text x="170" y="262" text-anchor="middle" font-size="12" fill="#3B6D11">static React build, OAC-only</text>

  <!-- ALB -->
  <rect x="560" y="222" width="190" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="655" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">ALB</text>
  <text x="655" y="262" text-anchor="middle" font-size="12" fill="#854F0B">port 80, HTTP-only</text>

  <line x1="655" y1="278" x2="655" y2="316" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EKS box -->
  <rect x="470" y="318" width="330" height="150" rx="16" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="490" y="342" font-size="13" font-weight="600" fill="#4A1B0C">EKS cluster (private subnets)</text>

  <rect x="500" y="360" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1"/>
  <text x="565" y="390" text-anchor="middle" font-size="13" fill="#712B13">backend-api pod</text>

  <rect x="650" y="360" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1"/>
  <text x="715" y="390" text-anchor="middle" font-size="13" fill="#712B13">backend-api pod</text>

  <text x="490" y="440" font-size="12" fill="#993C1D">Go / Gin  ·  routes: /health /auth/* /tasks* /users/*</text>

  <!-- to Mongo / Redis -->
  <line x1="565" y1="410" x2="290" y2="470" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="410" x2="565" y2="470" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MongoDB Atlas -->
  <rect x="120" y="472" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="230" y="499" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">MongoDB Atlas</text>

  <!-- Redis -->
  <rect x="460" y="472" width="220" height="44" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.5"/>
  <text x="570" y="499" text-anchor="middle" font-size="13" font-weight="600" fill="#4B1528">ElastiCache Redis</text>
</svg>
